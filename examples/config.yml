# =============================================================================
# Fairness Evaluation - Example Configuration
# =============================================================================
# Copy this file and customize it for your needs.
# Save as config.yml and pass to FairnessEvaluator(config_path="config.yml")
#
# Environment Variables Required:
#   OPENROUTER_API_KEY  - For OpenRouter models (free tier available)
#   GOOGLE_API_KEY      - For Google Gemini models
#
# You can also create a .env file in the same directory:
#   OPENROUTER_API_KEY=sk-or-v1-your-key-here
#   GOOGLE_API_KEY=your-google-key-here
# =============================================================================


# -----------------------------------------------------------------------------
# Default Model
# -----------------------------------------------------------------------------
# Which model to use by default for all agents.
# Must match one of the model names defined below.

default_model: "openrouter-free"  


# -----------------------------------------------------------------------------
# Models Configuration
# -----------------------------------------------------------------------------
# Define available AI models. Supports three providers:
#   - openrouter: Cloud API with many models (some free)
#   - gemini: Google's Gemini models
#   - ollama: Run models locally via Ollama

models:
  # ---- Local Ollama Model ----
  "deepseek-r1:8b":
    provider: ollama
    model: "deepseek-r1:8b"
    model_info:
      function_calling: true
      vision: false
      structured_output: true

  # ---- Free OpenRouter Model (Recommended for testing) ----
  openrouter-free:
    provider: openrouter
    model: "poolside/laguna-m.1:free"
    #model: "arcee-ai/trinity-large-preview:free"
    #model: "nvidia/nemotron-3-super-120b-a12b:free"
    base_url: "https://openrouter.ai/api/v1"
    model_info:
      function_calling: true
      vision: false
      structured_output: true

  # ---- Alternative Free OpenRouter Models ----
  # Uncomment to use different free models
  
  # llama-free:
  #   provider: openrouter
  #   model: "meta-llama/llama-3.2-3b-instruct:free"
  #   base_url: "https://openrouter.ai/api/v1"
  #   model_info:
  #     function_calling: true

  # qwen-free:
  #   provider: openrouter
  #   model: "qwen/qwen-2.5-72b-instruct:free"
  #   base_url: "https://openrouter.ai/api/v1"
  #   model_info:
  #     function_calling: true

  # ---- Paid OpenRouter Models (Better quality) ----
  # openrouter-gpt4:
  #   provider: openrouter
  #   model: "openai/gpt-4o-mini"
  #   base_url: "https://openrouter.ai/api/v1"
  #   model_info:
  #     function_calling: true

  # openrouter-claude:
  #   provider: openrouter
  #   model: "anthropic/claude-3.5-sonnet"
  #   base_url: "https://openrouter.ai/api/v1"
  #   model_info:
  #     function_calling: true

  # ---- Google Gemini ----
  gemini-flash:
    provider: gemini
    model: "gemini-2.0-flash"
    # api_key: loaded from GOOGLE_API_KEY env var automatically

  # gemini-pro:
  #   provider: gemini
  #   model: "gemini-1.5-pro"

  # ---- Local Ollama Models ----
# -----------------------------------------------------------------------------
# Tools Configuration
# -----------------------------------------------------------------------------
# Available tool managers. Don't modify unless adding custom tools.

tools:
  fairness:
    class: "FairnessTools"
    description: "Tools for fairness analysis and dataset inspection"
  
  bias_mitigation:
    class: "BiasMitigationTools"
    description: "Tools for bias mitigation techniques (SMOTE, reweighting, etc.)"


# -----------------------------------------------------------------------------
# Agents Configuration
# -----------------------------------------------------------------------------
# Agents that perform different tasks in the pipeline.
# Each agent can optionally specify its own model.
#
# Agent types:
#   - FunctionCallerAgent: Executes tools/functions
#   - DataAnalystAgent: Analyzes data and provides insights
#   - ConversationalAgent: General conversation, no tools

agents:
  file_parser:
    type: FunctionCallerAgent
    # model: gemini-flash  # Uncomment to use different model for this agent
    tools: [fairness]
    stages: [parsing]
    reflect_on_tool_use: true
  
  inspector:
    type: FunctionCallerAgent
    tools: [fairness]
    stages: [inspection]
    reflect_on_tool_use: true
  
  quality_analyst:
    type: DataAnalystAgent
    tools: [fairness]
    stages: [quality_analysis]
  
  fairness_analyst:
    type: DataAnalystAgent
    tools: [fairness]
    stages: [fairness_analysis]
  
  bias_mitigator:
    type: FunctionCallerAgent
    tools: [bias_mitigation]
    stages: [mitigation]
    reflect_on_tool_use: true
  
  recommendation:
    type: ConversationalAgent
    tools: []
    stages: [recommendation]


# -----------------------------------------------------------------------------
# Pipeline Configuration
# -----------------------------------------------------------------------------
# Defines the order of evaluation stages.
# Each stage can have one or more agents.

pipeline:
  stages:
    - name: parsing
      description: "Parse and load the dataset"
      agents: [file_parser]
    
    - name: inspection
      description: "Initial dataset inspection and validation"
      agents: [inspector]
    
    - name: quality_analysis
      description: "Analyze data quality issues"
      agents: [quality_analyst]
    
    - name: fairness_analysis
      description: "Analyze fairness and bias metrics"
      agents: [fairness_analyst]
    
    - name: mitigation
      description: "Apply bias mitigation techniques"
      agents: [bias_mitigator]
    
    - name: recommendation
      description: "Generate recommendations and summary"
      agents: [recommendation]


# -----------------------------------------------------------------------------
# Evaluation Settings
# -----------------------------------------------------------------------------
# Fine-tune evaluation behavior.

# How to launch the application via python example_usage.py.
#   gui   - Streamlit web interface (requires: pip install -r requirements-gui.txt)
#   quick - Headless evaluation driven by the settings in this file
mode: gui

# The target variable for analysis (change as needed)
target_column: "Income"  

# If true, runs a secondary agent over generated analysis to improve readability
use_humanizer: false 

# If true, generates detailed_metrics_report.md and .pdf with comprehensive group metrics
generate_detailed_report: true

# If true, runs a final agent to synthesize all findings into a top-level summary
generate_executive_summary: true

sensitive_attribute_analysis:
  # Type options:
  #   - auto: The agent will automatically detect which sensitive attributes to 
  #           analyze based on potential fairness concerns and dataset characteristics.
  #   - restricted: Analyze only the specific attributes listed below.
  type: auto
  # Only used when type is "restricted". List the column names to analyze:
  attributes: ["Sex", "Race", "Age"]
  
  
  # Enable or disable discretization of continuous sensitive attributes.
  discretization: enable  
  
  # auto: The agent receive information from the collum (max value, min value, mean, median, standard deviation, collum name) and from this can decide the bins (with its range) or the number of bins.
  # equal_width/equal_frequency: The user pass the number of bins and method (equal_width or equal_frequency).
  method: auto
  number_of_bins: 5

  # Minimum number of unique values for a numeric column to be considered continuous.
  # Columns with fewer unique values are treated as already categorical.
  continuous_threshold: 10
  

pair_evaluation:
  # Type options:
  #   - auto: The agent will automatically select which sensitive attribute pairs 
  #           to analyze based on potential fairness concerns (limited by max_pairs).
  #   - restricted: Analyze only the specific pairs listed below.
  type: auto
  # Maximum number of pairs when type is "auto". Set to null for all pairs.
  max_pairs: 2
  # Only used when type is "restricted". List the pairs to analyze:
  # Pairs can reference ANY column in the dataset, not just the sensitive attributes above.
  #pairs: [["Sex", "Race"], ["Age", "Education"]]

mitigation_techniques:
  # List of bias mitigation techniques to apply during the mitigation stage.
  # Options include: "reweighting", "resampling", "adversarial_debiasing", "preprocessing", "inprocessing", "postprocessing"
  techniques: ["reweighting", "resampling"]

ml_evaluation:
  # The ML model type to use for target fairness and mitigation comparisons.
  # Options: "Random Forest", "Gradient Boosting", "Logistic Regression", "SVC"; Default: "Random Forest"
  model_type: "Random Forest"

  # Default parameters for each ML model
  # Default parameters for Random Forest
  # "Random Forest":
  #   n_estimators: 100
  #   max_depth: null
  # Default parameters for Gradient Boosting
  # "Gradient Boosting":
  #   n_estimators: 100
  #   learning_rate: 0.1
  #   max_depth: 3
  # Default parameters for Logistic Regression
  # "Logistic Regression":
  #   C: 1.0
  #   penalty: "l2"
  # "SVC":
  #   C: 1.0
  #   kernel: "rbf"

  model_params:
    "Random Forest":
      n_estimators: 100
      max_depth: null 

