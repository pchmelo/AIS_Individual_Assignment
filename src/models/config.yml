# =============================================================================
# Agent Configuration File
# =============================================================================
# This file configures AI models, agents, tools, and pipeline stages.
#

# -----------------------------------------------------------------------------
# Models Configuration
# -----------------------------------------------------------------------------
# Define all available models here. Each entry is a named model that agents
# can reference. You can have multiple models of the same provider (e.g. two
# different local models for different tasks).
#
# Required keys per model:
#   provider: openrouter | gemini | local
#
# Provider-specific keys:
#   openrouter  -> model, base_url (optional), model_info (optional)
#   gemini      -> model, api_key (optional, defaults to GOOGLE_API_KEY env var)
#   local       -> model, device (optional), dtype (optional)


# -----------------------------------------------------------------------------
# Mode
# -----------------------------------------------------------------------------
# How to launch the application via python main.py.
#   gui  - Streamlit web interface (requires: pip install -r requirements-gui.txt)
#   cli  - Command-line interface
#   quick - Quick headless evaluation with defaults
mode: gui


default_model: step-3.5-flash  # default model for agents that don't specify one explicitly

models:
  step-3.5-flash:
    provider: openrouter
    model: "stepfun/step-3.5-flash:free"
    base_url: "https://openrouter.ai/api/v1"
    model_info:
      function_calling: true
      vision: false
      structured_output: true

  gemini-flash:
    provider: gemini
    model: "gemini-2.5-flash-lite"
    # api_key: loaded from GOOGLE_API_KEY env var

  granite-code:
    provider: local
    model: "ibm-granite/granite-3b-code-instruct"
    device: "auto"
    dtype: "float16"

# -----------------------------------------------------------------------------
# Tools Configuration
# -----------------------------------------------------------------------------
# Available tool managers that can be assigned to agents.

tools:
  fairness:
    class: "FairnessTools"
    description: "Tools for fairness analysis and dataset inspection"
  
  bias_mitigation:
    class: "BiasMitigationTools"
    description: "Tools for bias mitigation techniques (SMOTE, reweighting, etc.)"

# -----------------------------------------------------------------------------
# Agents Configuration
# -----------------------------------------------------------------------------
# Define agents with their types, tools, and pipeline associations.
#
# Agent types:
#   - FunctionCallerAgent: Executes tools based on user requests
#   - DataAnalystAgent: Analyzes data and provides insights
#   - ConversationalAgent: General conversation without tools
#
# Each agent can optionally specify 'model: <model_name>' to override the default_model. 

agents:
  file_parser:
    type: FunctionCallerAgent
    # model: <model_name>          # uncomment to override default
    tools: [fairness]
    stages: [parsing]
    reflect_on_tool_use: true
  
  inspector:
    type: FunctionCallerAgent
    tools: [fairness]
    stages: [inspection]
    reflect_on_tool_use: true
  
  quality_analyst:
    type: DataAnalystAgent
    tools: [fairness]
    stages: [quality_analysis]
  
  fairness_analyst:
    type: DataAnalystAgent
    tools: [fairness]
    stages: [fairness_analysis]
  
  bias_mitigator:
    type: FunctionCallerAgent
    tools: [bias_mitigation]
    stages: [mitigation]
    reflect_on_tool_use: true
  
  recommendation:
    type: ConversationalAgent
    tools: []
    stages: [recommendation]

# -----------------------------------------------------------------------------
# Pipeline Configuration
# -----------------------------------------------------------------------------
# Define the order and structure of pipeline stages.
# Each stage can have one or more agents assigned.

pipeline:
  stages:
    - name: parsing
      description: "Parse and load the dataset"
      agents: [file_parser]
    
    - name: inspection
      description: "Initial dataset inspection and validation"
      agents: [inspector]
    
    - name: quality_analysis
      description: "Analyze data quality issues"
      agents: [quality_analyst]
    
    - name: fairness_analysis
      description: "Analyze fairness and bias metrics"
      agents: [fairness_analyst]
    
    - name: mitigation
      description: "Apply bias mitigation techniques"
      agents: [bias_mitigator]
    
    - name: recommendation
      description: "Generate recommendations and summary"
      agents: [recommendation]


